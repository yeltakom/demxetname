<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ARAMA MOTORLARI BU SİTEYİ GÖSTERMESİN -->

<title>demxetname — diyarbakır zaman çizelgesi</title>

<style>
:root{
  --paper:#ffffff;
  --ink:#000000;
  --ink-80:#1a1a1a;
  --ink-60:#404040;
  --ink-40:#808080;
  --ink-20:#c0c0c0;
  --ink-10:#e5e5e5;
  --red:#ff2d00;
  --sans:Arial,Helvetica,sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  --spine:112px;   /* omurga cizgisinin x konumu */
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  font-size:13px;
  line-height:1.5;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* ---------- HEADER ---------- */
#header{
  position:sticky;top:0;z-index:50;
  background:var(--paper);
  border-bottom:1px solid var(--ink);
}
.hrow{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
  padding:14px 24px 10px;
}
#brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
#brand-mark{
  font-family:var(--serif);
  font-size:19px;
  letter-spacing:-0.01em;
}
#brand-sub{
  font-size:9px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--ink-60);
}
#ctrl{display:flex;align-items:baseline;gap:2px 14px;flex-wrap:wrap}
#filters{display:flex;gap:2px 12px;flex-wrap:wrap}
.f-btn{
  background:none;border:none;cursor:pointer;
  font-family:var(--sans);
  font-size:9px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--ink);
  display:flex;align-items:center;gap:6px;
  padding:4px 0;
  transition:opacity 0.15s;
}
.f-btn.off{opacity:0.25}
.f-btn:hover{text-decoration:underline}
#langs{display:flex;gap:0;border-left:1px solid var(--ink-10);padding-left:14px}
.lang-btn{
  background:none;border:none;cursor:pointer;
  font-family:var(--sans);
  font-size:10px;font-weight:700;
  letter-spacing:0.08em;
  color:var(--ink-40);
  padding:4px 6px;
}
.lang-btn.active{color:var(--ink)}
.lang-btn:hover{color:var(--ink)}

/* kategori isaretleri */
.glyph{
  width:9px;height:9px;flex-shrink:0;
  background:var(--ink);border-radius:50%;
}
.glyph[data-cat="yikim"]{background:var(--paper);border:1.5px solid var(--ink)}
.glyph[data-cat="yerinden"]{border-radius:0}
.glyph[data-cat="mimarlik"]{
  background:linear-gradient(135deg,var(--ink) 50%,var(--paper) 50%);
  border:1px solid var(--ink);
}
.glyph[data-cat="direnis"]{background:var(--red)}

/* ---------- CHART ---------- */
#chart{
  position:relative;
  max-width:920px;
  margin:0 auto;
  padding:36px 24px 80px;
}
#spine-line{
  position:absolute;
  top:36px;bottom:80px;
  left:calc(24px + var(--spine));
  width:1px;
  background:var(--ink);
}
#arcs{
  position:absolute;inset:0;
  pointer-events:none;
  z-index:5;
}

.decade{
  display:grid;
  grid-template-columns:var(--spine) 28px 1fr;
  align-items:baseline;
  margin:34px 0 10px;
}
.decade:first-child{margin-top:0}
.decade .d-label{
  font-family:var(--serif);
  font-size:17px;
  color:var(--ink);
  text-align:right;
  padding-right:18px;
}
.decade .d-rule{grid-column:2/4;border-top:1px solid var(--ink-10);align-self:center}

.ev{
  display:grid;
  grid-template-columns:var(--spine) 28px 1fr;
  align-items:start;
  cursor:pointer;
  padding:7px 0;
  transition:opacity 0.2s;
}
.ev-year{
  font-family:var(--serif);
  font-size:13px;
  color:var(--ink-80);
  text-align:right;
  padding-right:18px;
  padding-top:1px;
}
.ev-year.repeat{color:var(--ink-20)}
.ev-spine{
  position:relative;height:100%;
}
.ev-spine .glyph{
  position:absolute;
  left:-4px;top:6px;    /* omurga cizgisine oturur */
}
.ev-body{padding-left:2px;min-width:0}
.ev-title{
  font-size:13px;
  line-height:1.35;
}
.ev-loc{
  font-size:8.5px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--ink-40);
  margin-top:2px;
}
.ev:hover .ev-title{text-decoration:underline}

/* secim durumlari */
#chart.has-sel .ev{opacity:0.16}
#chart.has-sel .ev.rel{opacity:1}
#chart.has-sel .ev.sel{opacity:1}
.ev.sel .ev-title{font-weight:700}
.ev.sel .ev-spine .glyph{box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--red)}
.ev.rel .ev-title{color:var(--ink)}

.ev-detail{display:none;max-width:60ch;padding:10px 0 6px}
.ev.sel .ev-detail{display:block}
.ev-desc{
  font-size:12.5px;
  line-height:1.6;
  color:var(--ink-80);
}
.ev-links{margin-top:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.ev-link{
  background:none;border:none;cursor:pointer;
  font-family:var(--sans);
  font-size:10px;
  letter-spacing:0.04em;
  color:var(--red);
  text-align:left;
  padding:0;
}
.ev-link:hover{text-decoration:underline}
.ev-link .yl{font-family:var(--serif);font-size:11px}

/* ---------- FOOTER ---------- */
#footer{
  border-top:1px solid var(--ink);
  padding:16px 24px 40px;
  font-size:9px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--ink-60);
  line-height:2;
}

#loading{
  padding:120px 24px;
  text-align:center;
  font-size:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--ink-60);
}

@media(max-width:640px){
  :root{--spine:52px}
  .hrow{padding:12px 14px 8px}
  #chart{padding:24px 14px 60px}
  #spine-line{left:calc(14px + var(--spine));top:24px;bottom:60px}
  .ev-year{font-size:11px;padding-right:10px}
  .decade .d-label{font-size:14px;padding-right:10px}
  .ev{grid-template-columns:var(--spine) 22px 1fr}
  .decade{grid-template-columns:var(--spine) 22px 1fr}
}

::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--paper)}
::-webkit-scrollbar-thumb{background:var(--ink-20);border:3px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-60)}
</style>
</head>
<body>

<header id="header">
  <div class="hrow">
    <div id="brand">
      <div id="brand-mark">demxetname</div>
      <div id="brand-sub"
        data-tr="Diyarbakır ve Kürdistan'da bir zaman çizelgesi · 1853 — 2026"
        data-en="A timeline of Diyarbakır and Kurdistan · 1853 — 2026">Diyarbakır ve Kürdistan'da bir zaman çizelgesi · 1853 — 2026</div>
    </div>
    <div id="ctrl">
      <div id="filters">
        <button class="f-btn" data-cat="hukuki"><span class="glyph" data-cat="hukuki"></span><span data-tr="Hukuki &amp; İdari" data-en="Legal &amp; Administrative">Hukuki &amp; İdari</span></button>
        <button class="f-btn" data-cat="yikim"><span class="glyph" data-cat="yikim"></span><span data-tr="Kentsel Yıkım" data-en="Urban Destruction">Kentsel Yıkım</span></button>
        <button class="f-btn" data-cat="yerinden"><span class="glyph" data-cat="yerinden"></span><span data-tr="Yerinden Edilme" data-en="Displacement">Yerinden Edilme</span></button>
        <button class="f-btn" data-cat="mimarlik"><span class="glyph" data-cat="mimarlik"></span><span data-tr="Mimarlık &amp; Miras" data-en="Architecture &amp; Heritage">Mimarlık &amp; Miras</span></button>
        <button class="f-btn" data-cat="direnis"><span class="glyph" data-cat="direnis"></span><span data-tr="Direniş &amp; Siyaset" data-en="Resistance &amp; Politics">Direniş &amp; Siyaset</span></button>
      </div>
      <div id="langs">
        <button class="lang-btn active" data-lang="tr">TR</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<div id="loading">veri yükleniyor / loading data…</div>

<main id="chart" style="display:none">
  <div id="spine-line"></div>
  <svg id="arcs"></svg>
  <div id="rows"></div>
</main>

<footer id="footer" style="display:none">
  <span data-tr="Araştırma · Derleme" data-en="Research · Compilation">Araştırma · Derleme</span>
  — Yıldız Tahtacı — Pelin Tan — Yelta Köm<br>
  Arazi Assembly · 2020 / 2026
</footer>

<script>
// ============================================================
// demxetname — sade zaman çizelgesi
// Veri: events.csv. İlişkiler yalnızca veriden türetilir:
// bir olayın metninde anılan yıllar, o yıllardaki olaylara bağlanır.
// ============================================================

let events=[];
const state={
  lang:'tr',
  cats:new Set(['hukuki','yikim','yerinden','mimarlik','direnis']),
  sel:null
};
const rel=new Map();   // id -> Set(id)

/* ---- CSV ---- */
function parseCSV(text){
  const rows=[];let row=[],field='',q=false,i=0;
  while(i<text.length){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} q=false;i++;continue; }
      field+=c;i++;
    }else{
      if(c==='"'){q=true;i++;continue;}
      if(c===','){row.push(field);field='';i++;continue;}
      if(c==='\n'||c==='\r'){
        if(field!==''||row.length>0){row.push(field);rows.push(row);row=[];field='';}
        if(c==='\r'&&text[i+1]==='\n')i++;
        i++;continue;
      }
      field+=c;i++;
    }
  }
  if(field!==''||row.length>0){row.push(field);rows.push(row);}
  return rows;
}

async function load(){
  try{
    const res=await fetch('events.csv?'+Date.now());
    if(!res.ok)throw new Error('events.csv yüklenemedi');
    const rows=parseCSV(await res.text());
    const idx={};rows[0].forEach((h,i)=>idx[h.trim()]=i);
    events=rows.slice(1).filter(r=>r.length>=11&&r[0]).map(r=>({
      id:r[idx.id],
      year:parseInt(r[idx.year]),
      cat:r[idx.category].trim(),
      tr:{t:r[idx.title_tr],l:r[idx.location_tr],d:r[idx.description_tr]},
      en:{t:r[idx.title_en],l:r[idx.location_en],d:r[idx.description_en]}
    }));
    events.sort((a,b)=>a.year-b.year||(+a.id)-(+b.id));
    buildRelations();
    init();
  }catch(e){
    console.error(e);
    document.getElementById('loading').textContent='hata / error: events.csv bulunamadı';
  }
}

/* ---- iliskiler: metinde anilan yillar ---- */
function buildRelations(){
  const byYear=new Map();
  events.forEach(e=>{
    if(!byYear.has(e.year))byYear.set(e.year,[]);
    byYear.get(e.year).push(e.id);
  });
  const RE=/\b(18[5-9]\d|19\d\d|20[0-2]\d)\b/g;
  events.forEach(e=>{
    const txt=e.tr.t+' '+e.tr.d;
    const yrs=new Set([...txt.matchAll(RE)].map(m=>+m[1]));
    yrs.delete(e.year);
    yrs.forEach(y=>{
      (byYear.get(y)||[]).forEach(t=>{
        if(t===e.id)return;
        if(!rel.has(e.id))rel.set(e.id,new Set());
        if(!rel.has(t))rel.set(t,new Set());
        rel.get(e.id).add(t);
        rel.get(t).add(e.id);
      });
    });
  });
}

function init(){
  document.getElementById('loading').style.display='none';
  document.getElementById('chart').style.display='block';
  document.getElementById('footer').style.display='block';

  document.querySelectorAll('.f-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const c=b.dataset.cat;
      if(state.cats.has(c)){state.cats.delete(c);b.classList.add('off');}
      else{state.cats.add(c);b.classList.remove('off');}
      if(state.sel&&!visible().some(e=>e.id===state.sel))state.sel=null;
      render();
    });
  });
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      state.lang=b.dataset.lang;
      document.documentElement.lang=state.lang;
      document.querySelectorAll('.lang-btn').forEach(x=>x.classList.toggle('active',x.dataset.lang===state.lang));
      document.querySelectorAll('[data-tr]').forEach(el=>{
        const t=el.getAttribute('data-'+state.lang);
        if(t)el.innerHTML=t;
      });
      render();
    });
  });
  window.addEventListener('resize',()=>drawArcs());
  render();
}

const visible=()=>events.filter(e=>state.cats.has(e.cat));

/* ---- liste ---- */
function render(){
  const c=document.getElementById('rows');
  c.innerHTML='';
  let prevYear=null,prevDecade=null;
  visible().forEach(e=>{
    const dec=Math.floor(e.year/10)*10;
    if(dec!==prevDecade){
      const d=document.createElement('div');
      d.className='decade';
      d.innerHTML=`<div class="d-label">${dec}</div><div class="d-rule"></div>`;
      c.appendChild(d);
      prevDecade=dec;prevYear=null;
    }
    const t=e[state.lang];
    const row=document.createElement('div');
    row.className='ev';
    row.dataset.id=e.id;
    row.innerHTML=
      `<div class="ev-year${e.year===prevYear?' repeat':''}">${e.year}</div>`+
      `<div class="ev-spine"><span class="glyph" data-cat="${e.cat}"></span></div>`+
      `<div class="ev-body"><div class="ev-title">${t.t}</div><div class="ev-loc">${t.l}</div>`+
      `<div class="ev-detail"><div class="ev-desc">${t.d}</div><div class="ev-links"></div></div></div>`;
    row.addEventListener('click',ev=>{
      if(ev.target.closest('.ev-link'))return;
      select(state.sel===e.id?null:e.id,false);
    });
    c.appendChild(row);
    prevYear=e.year;
  });
  applySelection();
}

function select(id,scroll){
  state.sel=id;
  applySelection();
  if(id&&scroll){
    const row=document.querySelector(`.ev[data-id="${id}"]`);
    if(row)row.scrollIntoView({block:'center'});
  }
}

function applySelection(){
  const chart=document.getElementById('chart');
  const relSet=state.sel?(rel.get(state.sel)||new Set()):new Set();
  chart.classList.toggle('has-sel',!!state.sel);
  document.querySelectorAll('.ev').forEach(row=>{
    const id=row.dataset.id;
    row.classList.toggle('sel',id===state.sel);
    row.classList.toggle('rel',relSet.has(id));
    if(id===state.sel)fillLinks(row,relSet);
  });
  drawArcs();
}

function fillLinks(row,relSet){
  const box=row.querySelector('.ev-links');
  box.innerHTML='';
  const targets=visible().filter(e=>relSet.has(e.id));
  targets.forEach(e=>{
    const b=document.createElement('button');
    b.className='ev-link';
    b.innerHTML=`↔ <span class="yl">${e.year}</span> · ${e[state.lang].t}`;
    b.addEventListener('click',()=>select(e.id,true));
    box.appendChild(b);
  });
}

/* ---- kirmizi yaylar ---- */
function drawArcs(){
  const svg=document.getElementById('arcs');
  const chart=document.getElementById('chart');
  const W=chart.clientWidth,H=chart.scrollHeight;
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML='';
  if(!state.sel)return;
  const cr=chart.getBoundingClientRect();
  const dot=id=>{
    const g=document.querySelector(`.ev[data-id="${id}"] .glyph`);
    if(!g)return null;
    const r=g.getBoundingClientRect();
    return{x:r.left-cr.left+r.width/2,y:r.top-cr.top+r.height/2};
  };
  const s=dot(state.sel);
  if(!s)return;
  const relSet=rel.get(state.sel)||new Set();
  let paths='';
  visible().forEach(e=>{
    if(!relSet.has(e.id))return;
    const t=dot(e.id);
    if(!t)return;
    const k=Math.min(s.x-10,34+Math.abs(t.y-s.y)*0.05);
    paths+=`<path d="M ${s.x} ${s.y} C ${s.x-k} ${s.y}, ${s.x-k} ${t.y}, ${t.x} ${t.y}" fill="none" stroke="#ff2d00" stroke-width="1" opacity="0.85"/>`+
           `<circle cx="${t.x}" cy="${t.y}" r="2" fill="#ff2d00"/>`;
  });
  paths+=`<circle cx="${s.x}" cy="${s.y}" r="2.5" fill="#ff2d00"/>`;
  svg.innerHTML=paths;
}

load();
</script>
</body>
</html>
